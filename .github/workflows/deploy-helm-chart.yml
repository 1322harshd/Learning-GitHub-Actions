name: Deploy Helm Chart in Kubernetes Cluster
on:
    pull_request:
        types: [closed]
        branches:
            - main
    workflow_dispatch: {}
permissions:
        contents: read
        packages: read
env:
    OCI_REGISTRY: ghcr.io
    OCI_REPOSITORY: ${{ github.repository_owner }}/helm-charts

jobs:
    deploy-helm-chart:
        environment: PRODUCTION
        runs-on: github-actions-scaleset-demo

        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.1.0

            - name: Set up Helm
              uses: azure/setup-helm@v5.0.1
              with:
                version: v3.16.4

            - name: Login to GHCR (OCI)
              run: |
                echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.OCI_REGISTRY }} -u ${{ github.actor }} --password-stdin

            - name: Reading HELMCHART Version
              run: |
                source HELMCHART-VERSION
                echo "VERSION=$VERSION" >> $GITHUB_ENV
                echo "Deploying Helm Chart Version: ${VERSION}"

            - name: Deploy Helm Chart
              run: |
                helm upgrade --install thinknyxapp oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_REPOSITORY }}/thinknyxapp --version ${{ env.VERSION }} --namespace ${{ vars.NAMESPACE }} --create-namespace --wait

            - name: Debug pods on failure
              if: always()
              run: |
                echo "--- pods ---"
                kubectl get pods -n ${{ vars.NAMESPACE }} -o wide
                echo "--- describe pods ---"
                kubectl describe pod -n ${{ vars.NAMESPACE }} -l app=thinknyxapp
                echo "--- previous container logs (if crashed) ---"
                kubectl logs -n ${{ vars.NAMESPACE }} -l app=thinknyxapp --tail=100 --previous || true
                echo "--- current container logs ---"
                kubectl logs -n ${{ vars.NAMESPACE }} -l app=thinknyxapp --tail=100 || true