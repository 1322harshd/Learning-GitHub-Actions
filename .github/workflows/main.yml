name: CI pipeline

 
on: 
  pull_request:
    branches:
      - main

permissions:
  actions: read
  security-events: write
  packages: write
  contents: read

jobs:

    ci-pipeline-job:
      uses: 1322harshd/reusable-workflows/.github/workflows/ci-pipeline.yml@main
      with:
        run_codeql: true
        run_sonarqube: true
        run_build: true
        run_ghcr_publish: true
      secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    
    deploy-with-kubectl:
      needs: ci-pipeline-job
      uses:  1322harshd/reusable-workflows/.github/workflows/deploy-with-kubectl.yml@main

      with:
        ENVIRONMENT: STAGING
        IMAGE_NAME: ghcr.io/1322harshd/thinknyx_app

      secrets:
        KUBECONFIG: ${{ secrets.KUBECONFIG}}
    
    run-selenium-tests:
      needs: deploy-with-kubectl
      uses: 1322harshd/reusable-workflows/.github/workflows/selenium-tests.yml@main

      with:
        ENVIRONMENT: STAGING
      