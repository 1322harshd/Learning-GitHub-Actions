name: CI pipeline

#reusable workflows demo change

on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  security-events: write
  packages: write
  contents: read

jobs:

    ci-pipeline-job:
      uses: 1322harshd/reusable-workflows/.github/workflows/ci-pipeline.yml@main
      with:
        run_codeql: true
        run_sonarqube: true
      secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
