name: myFirstWorkflow

on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest

    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echho `pwd` >> myartifact.txt
          ls -ltr
          hostname
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
          
        
    
